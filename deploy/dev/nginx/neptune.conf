# TLS in front of the API (7443) and the admin console (7444). The upstreams
# are looked up through Docker's DNS on each request, so the proxy still
# starts when one of them is down and finds a recreated container without a
# restart.
resolver 127.0.0.11 valid=30s ipv6=off;

ssl_certificate /etc/letsencrypt/live/neptune/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/neptune/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:neptune_ssl:2m;

# Matches the largest upload either app accepts (20 MB) with room for the
# rest of the form.
client_max_body_size 21m;
server_tokens off;

server {
    listen 7443 ssl;
    http2 on;
    server_name neptune-api.techmadeeazy.com;

    set $api http://neptune-api:3001;

    location / {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# The admin console is the highest-risk surface (verification, invoicing,
# payouts), so it is limited to the allowlisted addresses here and again
# inside Laravel (EnsureAdminIpAllowlisted).
server {
    listen 7444 ssl;
    http2 on;
    server_name neptune-admin.techmadeeazy.com;

    include /etc/nginx/allowlist.conf;

    set $admin neptune-admin:9000;

    # Built CSS and JS. Every build gets new file names, so they can be
    # cached for good.
    location /build/ {
        root /var/www/admin;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        fastcgi_pass $admin;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        # FastCGI hands Laravel the real client address as REMOTE_ADDR, so
        # the admin needs no trusted proxy and ignores any forwarded header
        # a client sends.
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 120s;
    }
}

# neptune-api calls the admin's internal endpoints (guarded by
# ADMIN_INTERNAL_API_KEY) through this listener. Port 8080 is not published,
# so it is reachable only from containers on the neptune network, and it
# serves nothing but /api/internal.
server {
    listen 8080;
    server_name neptune-proxy;

    set $admin neptune-admin:9000;

    location /api/internal/ {
        fastcgi_pass $admin;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_read_timeout 120s;
    }

    location / {
        return 404;
    }
}
