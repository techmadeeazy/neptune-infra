# IP allowlist enforced in front of admin.neptune.local (nginx layer).
# This is layer 1 of 2. neptune-admin's EnsureAdminIpAllowlisted middleware
# is layer 2, reading the same list from ADMIN_IP_ALLOWLIST so the check
# still holds even if a request reaches Laravel by some other path.
#
# Local dev default: loopback only. Add real office/staff IPs/CIDRs before
# any non-local deployment. This file is intentionally not a production
# value, see neptune-infra/README.md.

allow 127.0.0.1;
allow ::1;
deny all;
