# admin.neptune.local: neptune-admin (Laravel), the highest-risk surface
# (verification, invoicing, payouts). Deliberately on its own host, separate
# from app.neptune.local/api.neptune.local, with an IP allowlist enforced
# here and again inside Laravel (EnsureAdminIpAllowlisted middleware). This
# is defense in depth in case a request ever reaches the app another way,
# such as a different nginx config or a direct container-to-container call.
server {
    listen 80;
    server_name admin.neptune.local;

    include /etc/nginx/allowlist.conf;

    location / {
        proxy_pass http://host.docker.internal:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
