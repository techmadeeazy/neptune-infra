# app.neptune.local — public origin, neptune-web (Next.js). No IP
# restriction: this is the user-facing app for Owner/Client/Broker/Captain.
server {
    listen 80;
    server_name app.neptune.local;

    location / {
        proxy_pass http://host.docker.internal:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# api.neptune.local — neptune-api (Fastify). Also public: neptune-web talks
# to it cross-origin via NEXT_PUBLIC_API_URL; this host exists mainly so the
# local topology mirrors production (app/api/admin all on distinct hosts).
server {
    listen 80;
    server_name api.neptune.local;

    location / {
        proxy_pass http://host.docker.internal:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
