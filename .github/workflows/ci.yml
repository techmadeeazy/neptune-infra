name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No app code lives here - this validates the compose file parses and
      # every variable interpolation resolves, catching YAML/config typos
      # before anyone tries to actually run it.
      - name: Validate docker-compose.yml
        run: docker compose config --quiet
